{% extends "base.html" %}

{% block title %}Sign In - EcoSort AI{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header" style="text-align: center;">
        <h2>Sign In</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Access your dashboard and segregation history</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" novalidate>
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}" required placeholder="e.g. user@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Register here</a>
    </div>
</div>
{% endblock %}
